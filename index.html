<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aaj kya banana hai?</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1 class="title">Aaj kya banana hai?</h1>
    </header>

    <div class="controls-row">
      <div class="btn-group" id="slotGroup">
        <button type="button" class="btn-toggle active" id="btnLunch">Lunch</button>
        <button type="button" class="btn-toggle" id="btnDinner">Dinner</button>
      </div>

      <div class="btn-group" id="cooldownGroup">
        <button type="button" class="btn-toggle active" id="btn7d">7 Days</button>
        <button type="button" class="btn-toggle" id="btn5d">5 Days</button>
      </div>
    </div>

    <div class="search-container">
      <input type="text" id="dishSearchInput" class="search-input" placeholder="Search dish..." autocomplete="off">
      <div id="searchDropdown" class="search-dropdown" style="display: none;"></div>
    </div>

    <section class="section">
      <table class="data-table">
        <thead>
          <tr>
            <th>Dish</th>
            <th class="col-votes">Votes</th>
            <th class="col-action">Action</th>
          </tr>
        </thead>
        <tbody id="suggestionsBody">
          <!-- Rendered via app.js -->
        </tbody>
      </table>

      <div class="table-actions">
        <button type="button" class="btn-secondary" id="rerollBtn">Reroll</button>
      </div>
    </section>

    <section class="section">
      <h2 class="section-title">History</h2>
      <table class="data-table">
        <thead>
          <tr>
            <th class="col-date">Date</th>
            <th class="col-slot">Slot</th>
            <th>Dish</th>
            <th class="col-action">Action</th>
          </tr>
        </thead>
        <tbody id="historyBody">
          <!-- Rendered via app.js -->
        </tbody>
      </table>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
